<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Créer un compte - MACHINIMA</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#080808;
    color:white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

.container{
    width:min(420px, calc(100% - 30px));

    padding:35px;

    background:#111;

    border:1px solid #292929;
    border-radius:12px;
}

.logo{
    display:block;

    margin-bottom:30px;

    color:#ff174f;

    font-size:25px;
    font-weight:bold;

    letter-spacing:2px;

    text-align:center;

    text-decoration:none;
}

h1{
    margin:0 0 8px;

    text-align:center;

    font-size:28px;
}

.subtitle{
    margin-bottom:30px;

    color:#777;

    text-align:center;

    font-size:14px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;

    margin-bottom:7px;

    color:#bbb;

    font-size:13px;
}

input{
    width:100%;

    padding:14px;

    border:1px solid #333;
    border-radius:7px;

    outline:none;

    background:#080808;
    color:white;

    font-size:14px;
}

input:focus{
    border-color:#ff174f;
}

button{
    width:100%;

    padding:14px;

    border:0;
    border-radius:7px;

    background:#ff174f;
    color:white;

    font-weight:bold;

    cursor:pointer;
}

button:hover{
    background:#ff3564;
}

button:disabled{
    opacity:.6;
    cursor:wait;
}

.message{
    min-height:20px;

    margin-top:18px;

    text-align:center;

    font-size:13px;

    line-height:1.5;
}

.bottom{
    margin-top:25px;

    text-align:center;

    color:#777;

    font-size:13px;
}

.bottom a{
    color:#ff174f;

    text-decoration:none;
}

.bottom a:hover{
    text-decoration:underline;
}

</style>

</head>


<body>


<div class="container">


<a
    href="index.html"
    class="logo"
>
    MACHINIMA
</a>


<h1>
Créer un compte
</h1>


<div class="subtitle">
Rejoins la communauté MACHINIMA.
</div>


<form id="registerForm">


<div class="form-group">

<label for="username">
Nom d'utilisateur
</label>

<input
    id="username"
    type="text"
    minlength="3"
    maxlength="30"
    autocomplete="username"
    placeholder="MonPseudo"
    required
>

</div>


<div class="form-group">

<label for="email">
Adresse e-mail
</label>

<input
    id="email"
    type="email"
    autocomplete="email"
    placeholder="email@exemple.com"
    required
>

</div>


<div class="form-group">

<label for="password">
Mot de passe
</label>

<input
    id="password"
    type="password"
    minlength="6"
    autocomplete="new-password"
    placeholder="6 caractères minimum"
    required
>

</div>


<div class="form-group">

<label for="passwordConfirm">
Confirmer le mot de passe
</label>

<input
    id="passwordConfirm"
    type="password"
    minlength="6"
    autocomplete="new-password"
    placeholder="Retape ton mot de passe"
    required
>

</div>


<button
    id="registerButton"
    type="submit"
>
Créer mon compte
</button>


<div
    id="message"
    class="message"
></div>


</form>


<div class="bottom">

Déjà un compte ?

<a href="login.html">
Se connecter
</a>

</div>


</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>


<script>

const {
    createClient
} = window.supabase;


const supabaseClient =
    createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const form =
    document.getElementById(
        "registerForm"
    );


const usernameInput =
    document.getElementById(
        "username"
    );


const emailInput =
    document.getElementById(
        "email"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const passwordConfirmInput =
    document.getElementById(
        "passwordConfirm"
    );


const registerButton =
    document.getElementById(
        "registerButton"
    );


const message =
    document.getElementById(
        "message"
    );


form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const username =
            usernameInput.value.trim();


        const email =
            emailInput.value.trim();


        const password =
            passwordInput.value;


        const passwordConfirm =
            passwordConfirmInput.value;


        /*
        Vérification pseudo
        */

        if(username.length < 3){

            message.textContent =
                "❌ Le nom d'utilisateur doit contenir au moins 3 caractères.";

            message.style.color =
                "#ff174f";

            return;
        }


        /*
        Vérification mot de passe
        */

        if(password.length < 6){

            message.textContent =
                "❌ Le mot de passe doit contenir au moins 6 caractères.";

            message.style.color =
                "#ff174f";

            return;
        }


        /*
        Vérification confirmation
        */

        if(
            password !==
            passwordConfirm
        ){

            message.textContent =
                "❌ Les mots de passe ne correspondent pas.";

            message.style.color =
                "#ff174f";

            return;
        }


        registerButton.disabled =
            true;


        message.textContent =
            "Création du compte...";

        message.style.color =
            "#aaa";


        try{

            /*
            Création du compte Supabase.

            Le username est placé
            dans user_metadata.

            Le trigger SQL crée
            automatiquement profiles.
            */

            const {
                data,
                error
            } =
                await supabaseClient
                .auth
                .signUp({

                    email:email,

                    password:password,

                    options:{

                        data:{

                            username:
                                username

                        }

                    }

                });


            if(error){

                throw error;
            }


            if(!data.user){

                throw new Error(
                    "Le compte n'a pas pu être créé."
                );

            }


            /*
            Confirmation e-mail activée
            */

            if(!data.session){

                message.textContent =
                    "✅ Compte créé ! Vérifie ton adresse e-mail pour confirmer ton compte.";

                message.style.color =
                    "#4ade80";

                form.reset();

                return;
            }


            /*
            Connexion immédiate
            si la confirmation e-mail
            n'est pas obligatoire.
            */

            message.textContent =
                "✅ Compte créé avec succès !";

            message.style.color =
                "#4ade80";


            form.reset();


            setTimeout(
                function(){

                    window.location.href =
                        "index.html";

                },
                1000
            );


        }catch(error){

            console.error(
                "Erreur inscription:",
                error
            );


            let text =
                error.message ||
                "Une erreur est survenue.";


            /*
            Messages plus compréhensibles
            */

            if(
                text
                .toLowerCase()
                .includes("already registered")
            ){

                text =
                    "Cette adresse e-mail possède déjà un compte.";

            }


            if(
                text
                .toLowerCase()
                .includes("password")
            ){

                text =
                    "Le mot de passe n'est pas valide.";

            }


            message.textContent =
                "❌ " +
                text;


            message.style.color =
                "#ff174f";


        }finally{

            registerButton.disabled =
                false;

        }

    }
);

</script>


</body>

</html>
