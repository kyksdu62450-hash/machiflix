<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#080808"><title>Saga — MACHIFLIX</title>
<link rel="stylesheet" href="style.css">
<style>
body{background:#080808;color:#f5f5f5}.saga-hero{max-width:1100px;margin:35px auto;padding:0 20px;display:grid;grid-template-columns:minmax(160px,270px) minmax(0,1fr);gap:28px;align-items:start}.saga-poster{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:12px;background:#171717}.saga-copy h1{font-size:clamp(30px,5vw,52px);margin:0 0 18px}.saga-player{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#151515;display:block}.player-placeholder{width:100%;aspect-ratio:16/9;border-radius:10px;background:#151515;display:grid;place-items:center;color:#aaa;text-align:center;padding:20px;box-sizing:border-box}.saga-films{max-width:1100px;margin:35px auto;padding:0 20px}.saga-films h2{margin-bottom:20px}.saga-film-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:16px}.saga-film{color:inherit;text-align:left;cursor:pointer;background:#121212;border:1px solid #292929;border-radius:10px;overflow:hidden;padding:0 0 12px;transition:border-color .15s,transform .15s}.saga-film:hover{border-color:#8c62ce;transform:translateY(-2px)}.saga-film.active{border:2px solid #a879ef}.film-thumb{aspect-ratio:16/9;background:linear-gradient(135deg,#22152e,#111);display:grid;place-items:center;color:#eee;font-size:34px}.saga-film h3{font-size:15px;line-height:1.35;margin:10px 12px 0}.saga-film .film-number{font-size:12px;color:#aaa;margin:8px 12px 0}.back-link{display:inline-block;margin:18px 20px;color:#eee}@media(max-width:650px){.saga-hero{grid-template-columns:95px minmax(0,1fr);gap:14px}.saga-copy h1{font-size:27px;margin-bottom:12px}.saga-films{margin-top:25px}.saga-film-grid{grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:12px}}
</style></head>
<body><a class="back-link" href="index.html">← Retour à MACHIFLIX</a>
<main><section class="saga-hero" id="sagaHero"><div class="loading">Chargement de la saga…</div></section><section class="saga-films"><h2>🎬 Les films de la saga</h2><div id="sagaFilmGrid" class="saga-film-grid"><div class="loading">Chargement des films…</div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function makePlayer(video,title){const iframe=document.createElement('iframe');iframe.className='saga-player';iframe.src=video.video_url;iframe.title=title;iframe.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';iframe.referrerPolicy='strict-origin-when-cross-origin';iframe.allowFullscreen=true;return iframe;}
(async()=>{const id=new URLSearchParams(location.search).get('id'),hero=document.getElementById('sagaHero'),grid=document.getElementById('sagaFilmGrid');if(!id){hero.textContent='Saga introuvable.';grid.textContent='';return;}try{const {data:saga,error}=await client.from('sagas').select('id,title,description,image_url').eq('id',id).eq('is_published',true).maybeSingle();if(error)throw error;if(!saga){hero.textContent='Cette saga est introuvable ou n’est pas publiée.';grid.textContent='';return;}document.title=saga.title+' — MACHIFLIX';
const poster=saga.image_url?`<img class="saga-poster" src="${esc(saga.image_url)}" alt="Affiche de ${esc(saga.title)}">`:'<div class="saga-poster" style="display:grid;place-items:center;font-size:48px">🎞️</div>';
hero.innerHTML=`${poster}<div class="saga-copy"><h1>${esc(saga.title)}</h1><div id="sagaPlayerArea" class="player-placeholder">Choisis un film ci-dessous pour le regarder ici.</div></div>`;
const {data:videos,error:videoError}=await client.from('saga_videos').select('id,title,video_url,sort_order').eq('saga_id',saga.id).order('sort_order',{ascending:true});if(videoError)throw videoError;grid.replaceChildren();if(!videos||!videos.length){grid.textContent='Aucun film n’a encore été ajouté à cette saga.';return;}
const playerArea=document.getElementById('sagaPlayerArea');function selectVideo(video,button){playerArea.replaceWith(makePlayer(video,video.title));const newPlayer=hero.querySelector('.saga-player');newPlayer.id='sagaPlayerArea';grid.querySelectorAll('.saga-film').forEach(el=>{el.classList.remove('active');el.setAttribute('aria-pressed','false')});button.classList.add('active');button.setAttribute('aria-pressed','true');}
videos.forEach((video,index)=>{const button=document.createElement('button');button.type='button';button.className='saga-film';button.setAttribute('aria-pressed','false');const thumb=document.createElement('div');thumb.className='film-thumb';thumb.textContent='▶';const title=document.createElement('h3');title.textContent=video.title;const number=document.createElement('div');number.className='film-number';number.textContent='Film '+(index+1);button.append(thumb,title,number);button.addEventListener('click',()=>selectVideo(video,button));grid.appendChild(button);});
}catch(e){console.error(e);hero.textContent='Impossible de charger cette saga pour le moment.';grid.textContent='';}})();
</script></body></html>
