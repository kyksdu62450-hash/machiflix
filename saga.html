<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#080808"><title>Saga — MACHIFLIX</title>
<link rel="stylesheet" href="style.css">
<style>body{background:#080808;color:#f5f5f5}.saga-hero{max-width:1100px;margin:35px auto;padding:0 20px;display:grid;grid-template-columns:minmax(160px,280px) 1fr;gap:28px;align-items:center}.saga-poster{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:12px;background:#171717}.saga-copy h1{font-size:clamp(30px,5vw,52px);margin:0 0 14px}.saga-copy p{color:#bbb;line-height:1.7;white-space:pre-wrap}.saga-films{max-width:1100px;margin:35px auto;padding:0 20px}.saga-films h2{margin-bottom:20px}.saga-film-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px}.saga-film{color:inherit;text-decoration:none;background:#121212;border:1px solid #242424;border-radius:10px;overflow:hidden}.saga-film iframe{width:100%;aspect-ratio:16/9;border:0;display:block;background:#1b1b1b}.saga-film{padding-bottom:12px}.saga-film h3{margin:12px}.saga-film h3{font-size:15px;padding:0 12px}.saga-film p{font-size:12px;color:#999;padding:0 12px 12px}.back-link{display:inline-block;margin:18px 20px;color:#eee}@media(max-width:600px){.saga-hero{grid-template-columns:110px 1fr;gap:15px}.saga-copy h1{font-size:28px}}</style>
</head><body>
<a class="back-link" href="index.html">← Retour à MACHIFLIX</a>
<main><section class="saga-hero" id="sagaHero"><div class="loading">Chargement de la saga…</div></section><section class="saga-films"><h2>🎬 Les films de la saga</h2><div id="sagaFilmGrid" class="saga-film-grid"><div class="loading">Chargement des films…</div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
(async()=>{const id=new URLSearchParams(location.search).get("id"),hero=document.getElementById("sagaHero"),grid=document.getElementById("sagaFilmGrid");if(!id){hero.textContent="Saga introuvable.";grid.textContent="";return;}try{const {data:saga,error}=await client.from("sagas").select("id,title,description,image_url").eq("id",id).eq("is_published",true).maybeSingle();if(error)throw error;if(!saga){hero.textContent="Cette saga est introuvable ou n’est pas publiée.";grid.textContent="";return;}document.title=saga.title+" — MACHIFLIX";hero.innerHTML=`${saga.image_url?`<img class="saga-poster" src="${esc(saga.image_url)}" alt="Affiche de ${esc(saga.title)}">`:'<div class="saga-poster" style="display:grid;place-items:center;font-size:48px">🎞️</div>'}<div class="saga-copy"><h1>${esc(saga.title)}</h1><p>${esc(saga.description||"")}</p></div>`;const {data:videos,error:videoError}=await client.from("saga_videos").select("id,title,video_url,sort_order").eq("saga_id",saga.id).order("sort_order",{ascending:true});if(videoError)throw videoError;grid.replaceChildren();if(!videos||!videos.length){grid.textContent="Aucun film n’a encore été ajouté à cette saga.";return;}for(const video of videos){const card=document.createElement("article");card.className="saga-film";const iframe=document.createElement("iframe");iframe.src=video.video_url;iframe.title=video.title;iframe.loading="lazy";iframe.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";iframe.referrerPolicy="strict-origin-when-cross-origin";iframe.allowFullscreen=true;const title=document.createElement("h3");title.textContent=video.title;card.append(iframe,title);grid.appendChild(card);}}catch(e){console.error(e);hero.textContent="Impossible de charger cette saga pour le moment.";grid.textContent="";}})();
</script></body></html>
