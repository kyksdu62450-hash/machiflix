<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Film — MACHINIMA</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#080808;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

header{
    position:sticky;
    top:0;
    z-index:100;

    min-height:70px;

    display:flex;
    align-items:center;
    gap:15px;

    padding:12px 30px;

    background:rgba(8,8,8,.96);
    border-bottom:1px solid #222;

    backdrop-filter:blur(14px);
}

.logo{
    color:#ff174f;
    text-decoration:none;
    font-size:23px;
    font-weight:bold;
    letter-spacing:2px;
}

.header-right{
    margin-left:auto;

    display:flex;
    gap:8px;
}

.header-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    padding:10px 14px;

    border:1px solid #333;
    border-radius:7px;

    background:#111;
    color:#bbb;

    text-decoration:none;

    font-size:11px;
    font-weight:bold;
}

.header-btn:hover{
    color:#fff;
    border-color:#ff174f;
}

main{
    width:min(1200px,calc(100% - 30px));
    margin:auto;
    padding:40px 0 70px;
}

.back{
    display:inline-block;

    margin-bottom:25px;

    color:#666;

    text-decoration:none;

    font-size:11px;
}

.back:hover{
    color:#fff;
}

.player{
    position:relative;

    width:100%;
    aspect-ratio:16/9;

    overflow:hidden;

    border:1px solid #222;
    border-radius:12px;

    background:#000;
}

.player video{
    width:100%;
    height:100%;

    display:block;

    object-fit:contain;

    background:#000;
}

.no-video{
    width:100%;
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#555;

    font-size:14px;
}

.content{
    padding:30px 0;
}

.category{
    display:inline-block;

    margin-bottom:10px;

    padding:6px 10px;

    border-radius:20px;

    background:#211017;

    color:#ff718c;

    font-size:9px;
    font-weight:bold;
}

h1{
    margin:0 0 12px;

    font-size:clamp(28px,5vw,48px);
}

.description{
    max-width:850px;

    color:#888;

    font-size:13px;
    line-height:1.8;

    white-space:pre-line;
}

.meta{
    display:flex;
    flex-wrap:wrap;

    gap:15px;

    margin-top:20px;

    color:#666;

    font-size:11px;
}

.actions{
    display:flex;
    flex-wrap:wrap;

    gap:10px;

    margin-top:25px;
}

.action-btn{
    min-height:45px;

    padding:0 18px;

    border:1px solid #333;
    border-radius:8px;

    background:#111;

    color:#ddd;

    cursor:pointer;

    font-size:11px;
    font-weight:bold;

    transition:.2s;
}

.action-btn:hover{
    border-color:#ff174f;
}

.favorite-btn{
    border-color:#6b1730;

    background:#260b14;

    color:#ff718c;
}

.favorite-btn.active{
    background:#ff174f;
    border-color:#ff174f;
    color:#fff;
}

.favorite-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    display:none;

    margin-bottom:20px;

    padding:13px;

    border-radius:8px;

    font-size:11px;
}

.message.show{
    display:block;
}

.message.error{
    border:1px solid #63182a;
    background:#260b12;
    color:#ff718c;
}

.message.success{
    border:1px solid #145d32;
    background:#092c18;
    color:#62e99a;
}

.loading{
    min-height:300px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#555;
}

.not-found{
    padding:70px 20px;

    border:1px dashed #292929;
    border-radius:10px;

    text-align:center;

    color:#666;
}

footer{
    padding:40px 20px;

    border-top:1px solid #222;

    color:#555;

    text-align:center;

    font-size:11px;
}

@media(max-width:600px){

    header{
        padding:12px 18px;
    }

    main{
        padding-top:25px;
    }

    .actions{
        flex-direction:column;
    }

    .action-btn{
        width:100%;
    }
}
</style>
</head>

<body>

<header>

<a href="index.html" class="logo">
    MACHINIMA
</a>

<div class="header-right">

<a href="index.html" class="header-btn">
    🏠 Accueil
</a>

<a
    id="accountButton"
    href="login.html"
    class="header-btn"
>
    🔐 Connexion
</a>

</div>

</header>


<main>

<a href="index.html" class="back">
    ← Retour aux films
</a>


<div id="message" class="message"></div>


<div id="loading" class="loading">
    Chargement du film...
</div>


<section
    id="filmContent"
    style="display:none;"
>


<div class="player">

<video
    id="videoPlayer"
    controls
    playsinline
    preload="metadata"
>
</video>

<div
    id="noVideo"
    class="no-video"
    style="display:none;"
>
    🎬 Vidéo indisponible
</div>

</div>


<div class="content">

<div
    id="filmCategory"
    class="category"
    style="display:none;"
>
</div>


<h1 id="filmTitle">
    —
</h1>


<div
    id="filmDescription"
    class="description"
>
</div>


<div class="meta">

<span>
    📅 <span id="filmYear">—</span>
</span>

<span>
    👁️ <span id="filmViews">0</span> vues
</span>

</div>


<div class="actions">

<button
    id="favoriteButton"
    class="action-btn favorite-btn"
    type="button"
>
    ❤️ Ajouter aux favoris
</button>


<a
    href="favoris.html"
    class="action-btn"
    style="display:inline-flex;align-items:center;justify-content:center;text-decoration:none;"
>
    📚 Mes favoris
</a>

</div>

</div>

</section>


<div
    id="notFound"
    class="not-found"
    style="display:none;"
>

🎬

<h2>
    Film introuvable
</h2>

<p>
    Ce machinima n'existe pas ou n'est plus disponible.
</p>

<a
    href="index.html"
    class="header-btn"
>
    Retour à l'accueil
</a>

</div>

</main>


<footer>

<div>
    MACHINIMA
</div>

<div>
    La plateforme dédiée aux machinimas.
</div>

</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const {
    createClient
} = window.supabase;

const supabaseClient =
    createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   ELEMENTS
========================================================= */

const loading =
    document.getElementById("loading");

const filmContent =
    document.getElementById("filmContent");

const notFound =
    document.getElementById("notFound");

const message =
    document.getElementById("message");

const favoriteButton =
    document.getElementById("favoriteButton");

const accountButton =
    document.getElementById("accountButton");

const videoPlayer =
    document.getElementById("videoPlayer");

const noVideo =
    document.getElementById("noVideo");


/* =========================================================
   ID DU FILM
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const filmId =
    params.get("id");


let currentUser = null;
let currentFilm = null;


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    text,
    type
){

    message.textContent =
        text;

    message.className =
        "message show " +
        type;
}


function hideMessage(){

    message.className =
        "message";
}


/* =========================================================
   COMPTE
========================================================= */

async function loadUser(){

    try{

        const {
            data
        } =
            await supabaseClient
            .auth
            .getUser();

        currentUser =
            data?.user || null;


        if(currentUser){

            accountButton.href =
                "profil.html";

            accountButton.textContent =
                "👤 Profil";

        }else{

            accountButton.href =
                "login.html";

            accountButton.textContent =
                "🔐 Connexion";

        }

    }catch(error){

        currentUser =
            null;

    }

}


/* =========================================================
   CHARGER LE FILM
========================================================= */

async function loadFilm(){

    if(!filmId){

        showNotFound();

        return;
    }


    const {
        data,
        error
    } =
        await supabaseClient
        .from("machinimas")
        .select("*")
        .eq("id",filmId)
        .maybeSingle();


    if(error){

        console.error(
            "Erreur film:",
            error
        );

        showMessage(
            "Erreur : " +
            error.message,
            "error"
        );

        showNotFound();

        return;
    }


    if(!data){

        showNotFound();

        return;
    }


    currentFilm =
        data;


    displayFilm(
        data
    );


    await checkFavorite();

}


/* =========================================================
   AFFICHER FILM
========================================================= */

function displayFilm(
    film
){

    document.title =
        (
            film.title ||
            "Film"
        ) +
        " — MACHINIMA";


    document.getElementById(
        "filmTitle"
    ).textContent =
        film.title ||
        "Sans titre";


    document.getElementById(
        "filmDescription"
    ).textContent =
        film.description ||
        "Aucune description.";


    document.getElementById(
        "filmYear"
    ).textContent =
        film.year ||
        "—";


    document.getElementById(
        "filmViews"
    ).textContent =
        Number(
            film.views || 0
        ).toLocaleString(
            "fr-FR"
        );


    const category =
        document.getElementById(
            "filmCategory"
        );


    if(film.category){

        category.textContent =
            film.category;

        category.style.display =
            "inline-block";

    }else{

        category.style.display =
            "none";

    }


    /*
     * Compatible avec plusieurs noms
     * de colonne vidéo.
     */

    const videoUrl =
        film.video_url ||
        film.video ||
        film.url;


    if(videoUrl){

        videoPlayer.src =
            videoUrl;

        videoPlayer.style.display =
            "block";

        noVideo.style.display =
            "none";

    }else{

        videoPlayer.style.display =
            "none";

        noVideo.style.display =
            "flex";

    }


    loading.style.display =
        "none";

    filmContent.style.display =
        "block";

}


/* =========================================================
   FILM INTROUVABLE
========================================================= */

function showNotFound(){

    loading.style.display =
        "none";

    filmContent.style.display =
        "none";

    notFound.style.display =
        "block";

}


/* =========================================================
   VERIFIER FAVORI
========================================================= */

async function checkFavorite(){

    if(!currentUser){

        favoriteButton.textContent =
            "🔐 Connecte-toi pour ajouter aux favoris";

        favoriteButton.classList.remove(
            "active"
        );

        return;
    }


    const {
        data,
        error
    } =
        await supabaseClient
        .from("favorites")
        .select("id")
        .eq(
            "user_id",
            currentUser.id
        )
        .eq(
            "machinima_id",
            currentFilm.id
        )
        .maybeSingle();


    if(error){

        console.error(
            "Erreur favori:",
            error
        );

        favoriteButton.textContent =
            "❤️ Ajouter aux favoris";

        return;
    }


    if(data){

        favoriteButton.textContent =
            "💔 Retirer des favoris";

        favoriteButton.classList.add(
            "active"
        );

    }else{

        favoriteButton.textContent =
            "❤️ Ajouter aux favoris";

        favoriteButton.classList.remove(
            "active"
        );

    }

}


/* =========================================================
   AJOUT / RETRAIT FAVORI
========================================================= */

favoriteButton.addEventListener(
    "click",
    async function(){

        hideMessage();


        /*
         * Si pas connecté,
         * direction vers login.
         */

        if(!currentUser){

            window.location.href =
                "login.html?redirect=" +
                encodeURIComponent(
                    window.location.href
                );

            return;
        }


        favoriteButton.disabled =
            true;


        try{

            const {
                data:existing,
                error:checkError
            } =
                await supabaseClient
                .from("favorites")
                .select("id")
                .eq(
                    "user_id",
                    currentUser.id
                )
                .eq(
                    "machinima_id",
                    currentFilm.id
                )
                .maybeSingle();


            if(checkError){
                throw checkError;
            }


            /*
             * RETIRER
             */

            if(existing){

                const {
                    error
                } =
                    await supabaseClient
                    .from("favorites")
                    .delete()
                    .eq(
                        "id",
                        existing.id
                    );


                if(error){
                    throw error;
                }


                favoriteButton.textContent =
                    "❤️ Ajouter aux favoris";

                favoriteButton.classList.remove(
                    "active"
                );


                showMessage(
                    "Favori retiré.",
                    "success"
                );


            /*
             * AJOUTER
             */

            }else{

                const {
                    error
                } =
                    await supabaseClient
                    .from("favorites")
                    .insert({
                        user_id:
                            currentUser.id,

                        machinima_id:
                            currentFilm.id
                    });


                if(error){
                    throw error;
                }


                favoriteButton.textContent =
                    "💔 Retirer des favoris";

                favoriteButton.classList.add(
                    "active"
                );


                showMessage(
                    "❤️ Film ajouté aux favoris !",
                    "success"
                );

            }


        }catch(error){

            console.error(
                "Erreur favoris:",
                error
            );

            showMessage(
                "❌ Impossible de modifier les favoris : " +
                error.message,
                "error"
            );

        }finally{

            favoriteButton.disabled =
                false;

        }

    }
);


/* =========================================================
   DEMARRAGE
========================================================= */

async function init(){

    await loadUser();

    await loadFilm();

}


init();

</script>

</body>

</html>
```
