<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Connexion — MACHINIMA</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(255,23,79,.12),
            transparent 35%
        ),
        #080808;

    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

.container{

    width:min(
        430px,
        calc(100% - 30px)
    );

}

.logo{

    display:block;

    margin-bottom:30px;

    color:#ff174f;

    text-align:center;

    text-decoration:none;

    font-size:28px;

    font-weight:bold;

    letter-spacing:3px;
}

.card{

    padding:28px;

    border:1px solid #252525;

    border-radius:12px;

    background:#101010;

    box-shadow:
        0 25px 80px rgba(0,0,0,.45);
}

.tabs{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:5px;

    margin-bottom:25px;

    padding:4px;

    border-radius:8px;

    background:#080808;
}

.tab{

    padding:11px;

    border:0;

    border-radius:6px;

    background:transparent;

    color:#666;

    cursor:pointer;

    font-size:12px;

    font-weight:bold;
}

.tab.active{

    background:#ff174f;

    color:#fff;
}

h1{

    margin:0 0 8px;

    font-size:25px;
}

.subtitle{

    margin:0 0 25px;

    color:#666;

    font-size:12px;

    line-height:1.6;
}

.form-group{

    margin-bottom:16px;
}

label{

    display:block;

    margin-bottom:7px;

    color:#777;

    font-size:10px;

    font-weight:bold;

    text-transform:uppercase;

    letter-spacing:.7px;
}

input{

    width:100%;

    padding:13px 14px;

    border:1px solid #2b2b2b;

    border-radius:7px;

    outline:none;

    background:#0d0d0d;

    color:#fff;

    font-size:13px;
}

input:focus{

    border-color:#ff174f;
}

input::placeholder{

    color:#444;
}

.submit{

    width:100%;

    margin-top:5px;

    padding:13px;

    border:0;

    border-radius:7px;

    background:#ff174f;

    color:#fff;

    cursor:pointer;

    font-size:12px;

    font-weight:bold;
}

.submit:hover{

    background:#ff3564;
}

.submit:disabled{

    opacity:.5;

    cursor:not-allowed;
}

.message{

    display:none;

    margin-bottom:17px;

    padding:12px;

    border-radius:7px;

    font-size:11px;

    line-height:1.5;
}

.message.show{

    display:block;
}

.message.error{

    border:1px solid #63182a;

    background:#260b12;

    color:#ff718c;
}

.message.success{

    border:1px solid #145d32;

    background:#092c18;

    color:#62e99a;
}

.message.info{

    border:1px solid #24476f;

    background:#0c1725;

    color:#7bb5ff;
}

.password-info{

    margin-top:7px;

    color:#444;

    font-size:9px;
}

.back{

    display:block;

    margin-top:20px;

    color:#555;

    text-align:center;

    text-decoration:none;

    font-size:11px;
}

.back:hover{

    color:#fff;
}

.hidden{

    display:none;
}

</style>

</head>


<body>


<div class="container">


<a
    href="index.html"
    class="logo"
>
    MACHINIMA
</a>


<div class="card">


<div class="tabs">

<button
    id="loginTab"
    class="tab active"
    type="button"
>
    Connexion
</button>

<button
    id="registerTab"
    class="tab"
    type="button"
>
    Inscription
</button>

</div>



<div
    id="message"
    class="message"
>
</div>



<!-- =========================================================
     CONNEXION
========================================================= -->

<form
    id="loginForm"
>

<h1>
    Bon retour 👋
</h1>

<p class="subtitle">
    Connecte-toi à ton compte MACHINIMA.
</p>


<div class="form-group">

<label for="loginEmail">
    Email
</label>

<input
    id="loginEmail"
    type="email"
    placeholder="ton@email.com"
    autocomplete="email"
    required
>

</div>


<div class="form-group">

<label for="loginPassword">
    Mot de passe
</label>

<input
    id="loginPassword"
    type="password"
    placeholder="Ton mot de passe"
    autocomplete="current-password"
    required
>

</div>


<button
    id="loginButton"
    class="submit"
    type="submit"
>
    Se connecter
</button>

</form>



<!-- =========================================================
     INSCRIPTION
========================================================= -->

<form
    id="registerForm"
    class="hidden"
>

<h1>
    Créer un compte 🚀
</h1>

<p class="subtitle">
    Rejoins MACHINIMA gratuitement.
</p>


<div class="form-group">

<label for="registerEmail">
    Email
</label>

<input
    id="registerEmail"
    type="email"
    placeholder="ton@email.com"
    autocomplete="email"
    required
>

</div>


<div class="form-group">

<label for="registerPassword">
    Mot de passe
</label>

<input
    id="registerPassword"
    type="password"
    placeholder="Minimum 6 caractères"
    autocomplete="new-password"
    minlength="6"
    required
>

<div class="password-info">
    Utilise au minimum 6 caractères.
</div>

</div>


<div class="form-group">

<label for="registerPasswordConfirm">
    Confirmation
</label>

<input
    id="registerPasswordConfirm"
    type="password"
    placeholder="Retape ton mot de passe"
    autocomplete="new-password"
    minlength="6"
    required
>

</div>


<button
    id="registerButton"
    class="submit"
    type="submit"
>
    Créer mon compte
</button>

</form>



<a
    href="index.html"
    class="back"
>
    ← Retour à MACHINIMA
</a>

</div>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const {
    createClient
} = window.supabase;


const supabaseClient =
    createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   ELEMENTS
========================================================= */

const loginTab =
    document.getElementById(
        "loginTab"
    );

const registerTab =
    document.getElementById(
        "registerTab"
    );

const loginForm =
    document.getElementById(
        "loginForm"
    );

const registerForm =
    document.getElementById(
        "registerForm"
    );

const message =
    document.getElementById(
        "message"
    );

const loginButton =
    document.getElementById(
        "loginButton"
    );

const registerButton =
    document.getElementById(
        "registerButton"
    );


/* =========================================================
   MESSAGES
========================================================= */

function showMessage(
    text,
    type = "info"
){

    message.textContent =
        text;

    message.className =
        "message show " +
        type;

}


function hideMessage(){

    message.className =
        "message";

}


/* =========================================================
   TABS
========================================================= */

loginTab.addEventListener(
    "click",
    function(){

        loginTab.classList.add(
            "active"
        );

        registerTab.classList.remove(
            "active"
        );

        loginForm.classList.remove(
            "hidden"
        );

        registerForm.classList.add(
            "hidden"
        );

        hideMessage();

    }
);


registerTab.addEventListener(
    "click",
    function(){

        registerTab.classList.add(
            "active"
        );

        loginTab.classList.remove(
            "active"
        );

        registerForm.classList.remove(
            "hidden"
        );

        loginForm.classList.add(
            "hidden"
        );

        hideMessage();

    }
);


/* =========================================================
   CONNEXION
========================================================= */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        hideMessage();

        loginButton.disabled =
            true;

        loginButton.textContent =
            "Connexion...";


        const email =
            document
            .getElementById(
                "loginEmail"
            )
            .value
            .trim();


        const password =
            document
            .getElementById(
                "loginPassword"
            )
            .value;


        try{

            const {
                data,
                error
            } =
                await supabaseClient
                .auth
                .signInWithPassword({

                    email:email,

                    password:password

                });


            if(error){

                throw error;

            }


            if(!data.user){

                throw new Error(
                    "Connexion impossible."
                );

            }


            showMessage(
                "✅ Connexion réussie ! Redirection...",
                "success"
            );


            setTimeout(
                function(){

                    window.location.href =
                        "index.html";

                },
                800
            );


        }catch(error){

            console.error(
                "Erreur connexion:",
                error
            );


            showMessage(
                getAuthError(
                    error
                ),
                "error"
            );


        }finally{

            loginButton.disabled =
                false;

            loginButton.textContent =
                "Se connecter";

        }

    }
);


/* =========================================================
   INSCRIPTION
========================================================= */

registerForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        hideMessage();

        registerButton.disabled =
            true;

        registerButton.textContent =
            "Création...";


        const email =
            document
            .getElementById(
                "registerEmail"
            )
            .value
            .trim();


        const password =
            document
            .getElementById(
                "registerPassword"
            )
            .value;


        const confirmation =
            document
            .getElementById(
                "registerPasswordConfirm"
            )
            .value;


        if(password.length < 6){

            showMessage(
                "❌ Le mot de passe doit contenir au moins 6 caractères.",
                "error"
            );

            registerButton.disabled =
                false;

            registerButton.textContent =
                "Créer mon compte";

            return;

        }


        if(password !== confirmation){

            showMessage(
                "❌ Les deux mots de passe ne correspondent pas.",
                "error"
            );

            registerButton.disabled =
                false;

            registerButton.textContent =
                "Créer mon compte";

            return;

        }


        try{

            const {
                data,
                error
            } =
                await supabaseClient
                .auth
                .signUp({

                    email:email,

                    password:password

                });


            if(error){

                throw error;

            }


            /*
               Si Supabase demande
               une confirmation email.
            */

            if(
                data.user &&
                !data.session
            ){

                showMessage(
                    "✅ Compte créé ! Vérifie ton adresse email pour confirmer ton compte.",
                    "success"
                );

            }else{

                showMessage(
                    "✅ Compte créé ! Redirection...",
                    "success"
                );


                setTimeout(
                    function(){

                        window.location.href =
                            "index.html";

                    },
                    1000
                );

            }


        }catch(error){

            console.error(
                "Erreur inscription:",
                error
            );


            showMessage(
                getAuthError(
                    error
                ),
                "error"
            );


        }finally{

            registerButton.disabled =
                false;

            registerButton.textContent =
                "Créer mon compte";

        }

    }
);


/* =========================================================
   ERREURS SUPABASE
========================================================= */

function getAuthError(
    error
){

    const text =
        (
            error?.message ||
            ""
        ).toLowerCase();


    if(
        text.includes(
            "invalid login credentials"
        )
    ){

        return "❌ Email ou mot de passe incorrect.";

    }


    if(
        text.includes(
            "email not confirmed"
        )
    ){

        return "❌ Ton email n'est pas encore confirmé.";

    }


    if(
        text.includes(
            "user already registered"
        )
    ){

        return "❌ Un compte existe déjà avec cet email.";

    }


    if(
        text.includes(
            "password should be at least"
        )
    ){

        return "❌ Le mot de passe est trop court.";

    }


    return (
        "❌ " +
        (
            error?.message ||
            "Une erreur est survenue."
        )
    );

}


/* =========================================================
   VERIFIER SESSION EXISTANTE
========================================================= */

async function checkExistingSession(){

    const {
        data
    } =
        await supabaseClient
        .auth
        .getSession();


    if(
        data &&
        data.session
    ){

        showMessage(
            "Tu es déjà connecté. Redirection...",
            "info"
        );


        setTimeout(
            function(){

                window.location.href =
                    "index.html";

            },
            700
        );

    }

}


checkExistingSession();

</script>

</body>

</html>
