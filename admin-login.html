<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Connexion Admin - MACHINIMA</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #080808;
            color: white;

            font-family: Arial, Helvetica, sans-serif;
        }

        .login-box {
            width: 380px;
            max-width: calc(100% - 30px);

            padding: 40px;

            background: #151515;

            border: 1px solid #292929;
            border-radius: 12px;
        }

        .logo {
            margin-bottom: 30px;

            text-align: center;

            color: #ff174f;

            font-size: 25px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        h1 {
            margin: 0 0 8px;

            text-align: center;

            font-size: 25px;
        }

        .subtitle {
            margin-bottom: 30px;

            text-align: center;

            color: #888;

            font-size: 14px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #ccc;

            font-size: 13px;
        }

        input {
            width: 100%;

            margin-bottom: 20px;

            padding: 14px;

            border: 1px solid #333;
            border-radius: 7px;

            outline: none;

            background: #0d0d0d;
            color: white;

            font-size: 15px;
        }

        input:focus {
            border-color: #ff174f;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 7px;

            background: #ff174f;
            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #ff3564;
        }

        button:disabled {
            opacity: .6;
            cursor: wait;
        }

        #message {
            min-height: 20px;

            margin-top: 18px;

            text-align: center;

            font-size: 13px;
        }

        .back {
            display: block;

            margin-top: 25px;

            color: #777;

            text-align: center;

            text-decoration: none;

            font-size: 13px;
        }

        .back:hover {
            color: white;
        }

    </style>
</head>


<body>

<div class="login-box">

    <div class="logo">
        MACHINIMA
    </div>

    <h1>
        Administration
    </h1>

    <div class="subtitle">
        Connecte-toi pour continuer.
    </div>


    <form id="loginForm">

        <label for="email">
            Adresse e-mail
        </label>

        <input
            id="email"
            type="email"
            placeholder="admin@exemple.com"
            autocomplete="email"
            required
        >


        <label for="password">
            Mot de passe
        </label>

        <input
            id="password"
            type="password"
            placeholder="Mot de passe"
            autocomplete="current-password"
            required
        >


        <button
            id="loginButton"
            type="submit"
        >
            Se connecter
        </button>

    </form>


    <div id="message"></div>


    <a
        href="index.html"
        class="back"
    >
        ← Retour au site
    </a>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>


<script>

    const {
        createClient
    } = window.supabase;


    const supabaseClient =
        createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    const form =
        document.getElementById(
            "loginForm"
        );


    const message =
        document.getElementById(
            "message"
        );


    const loginButton =
        document.getElementById(
            "loginButton"
        );


    form.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const email =
                document.getElementById(
                    "email"
                ).value.trim();


            const password =
                document.getElementById(
                    "password"
                ).value;


            message.textContent =
                "Connexion...";


            message.style.color =
                "#aaa";


            loginButton.disabled =
                true;


            const {
                data,
                error
            } =
                await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });


            if (error) {

                console.error(error);

                message.textContent =
                    "Erreur : " +
                    error.message;

                message.style.color =
                    "#ff174f";

                loginButton.disabled =
                    false;

                return;
            }


            if (data.session) {

                message.textContent =
                    "Connexion réussie !";

                message.style.color =
                    "#4ade80";


                setTimeout(
                    function() {

                        window.location.href =
                            "admin.html";

                    },
                    500
                );

            }

        }
    );

</script>

</body>

</html>
